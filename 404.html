<!DOCTYPE html>

<head>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --black: #090a0a;
            --panel: #151817;
            --white: #f1f0eb;
            --text: #d8d8d2;
            --muted: #8d918c;

            --green: #91b83f;
            --green-light: #b1d65b;

            --line: rgba(255,255,255,.09);
        }

        body {
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            background: var(--black);
            color: var(--text);
            min-height: 100vh;
            line-height: 1.7;
            display: flex;
            flex-direction: column;
        }

        a {
            color: var(--green-light);
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        nav {
            height: 72px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 5vw;
            background: rgba(9,10,10,.94);
            border-bottom: 1px solid var(--line);
        }

        .logo {
            font-family: Impact, "Arial Narrow", sans-serif;
            font-size: 1.45rem;
            letter-spacing: .5px;
            text-transform: uppercase;
            color: var(--white);
        }

        .logo:hover {
            text-decoration: none;
        }

        .logo span {
            color: var(--green);
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 70px 6vw 90px;
        }

        .code {
            font-family: Impact, "Arial Narrow", sans-serif;
            font-size: clamp(6rem, 22vw, 12rem);
            line-height: 1;
            color: var(--green);
            letter-spacing: .02em;
        }

        .page-label {
            color: var(--green-light);
            font-size: .7rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: .2em;
            margin-top: 10px;
            margin-bottom: 10px;
        }

        h1 {
            font-family: Impact, "Arial Narrow", sans-serif;
            font-size: clamp(2rem, 5vw, 3rem);
            text-transform: uppercase;
            color: var(--white);
            margin-bottom: 16px;
        }

        p {
            max-width: 480px;
            font-size: .95rem;
            color: var(--text);
            margin-bottom: 32px;
        }

        .buttons {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
        }

        .btn {
            display: inline-block;
            padding: 12px 24px;
            font-size: .78rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: .1em;
            border: 1px solid var(--line);
            background: var(--panel);
            color: var(--white);
            transition: border-color .2s ease, color .2s ease;
        }

        .btn:hover {
            text-decoration: none;
            border-color: var(--green);
            color: var(--green-light);
        }

        .btn.primary {
            background: var(--green);
            border-color: var(--green);
            color: var(--black);
        }

        .btn.primary:hover {
            background: var(--green-light);
            border-color: var(--green-light);
            color: var(--black);
        }

        footer {
            padding: 30px 20px 40px;
            text-align: center;
            color: var(--muted);
            font-size: .72rem;
            text-transform: uppercase;
            letter-spacing: .08em;
        }

        footer strong {
            color: var(--white);
        }

        .footer-links {
            margin-top: 10px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 18px;
        }

        .footer-links a {
            color: var(--muted);
            transition: color .2s ease;
        }

        .footer-links a:hover {
            color: var(--green-light);
            text-decoration: none;
        }

        @media (max-width: 600px) {
            nav {
                padding: 0 20px;
            }
        }

    </style>

</head>
